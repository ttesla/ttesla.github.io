<!doctype html>
<html lang="{{ site.Language.Locale | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="kind-{{ .Kind }}{{ with .Section }} section-{{ . }}{{ end }}">
  <a class="skip" href="#main">Skip to content</a>
  {{ partial "header.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "footer.html" . }}
  <div class="crt-overlay" aria-hidden="true"></div>
  <div class="toast" role="status" aria-live="polite"></div>
  {{ partial "credits-popup.html" . }}

  {{ with resources.Get "js/main.js" | js.Build (dict "minify" hugo.IsProduction) | fingerprint }}
  <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
  {{ end }}
</body>
</html>
